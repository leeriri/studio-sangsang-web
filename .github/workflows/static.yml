name: Deploy Studio Sangsang to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download website archive
        run: |
          curl --fail --location --retry 3 https://github.com/leeriri/studio-sangsang-web/releases/download/v1.0.0/studio-sangsang.zip.zip --output site.zip
          echo "e3d4d7c0440c1914ff88aaf57d1f84288863af5d6c404755def0192e3f337123  site.zip" | sha256sum --check
          mkdir site
          unzip -q site.zip -d site
          test -f site/index.html
          test -f site/main/index.html
          test -f site/ai-video/index.html
          touch site/.nojekyll
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
